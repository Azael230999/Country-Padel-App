<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2A1D14" />
    <title>Country Padel — Sin conexión</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1C130D;
        font-family: Georgia, "Times New Roman", serif;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: #F5EEE2;
        border-radius: 24px;
        padding: 40px 28px 32px;
        text-align: center;
        box-shadow: 0 20px 48px rgba(42, 29, 20, 0.4);
      }
      .brand {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 2px;
        color: #8C7862;
        margin-bottom: 22px;
      }
      .icon {
        width: 52px;
        height: 52px;
        margin: 0 auto 18px;
        color: #B24A28;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        color: #2A1D14;
      }
      p {
        margin: 0 0 26px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        line-height: 1.6;
        color: #4A3F35;
      }
      button {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 700;
        font-size: 13px;
        color: #FFFDF8;
        background: #B24A28;
        border: none;
        border-radius: 10px;
        padding: 12px 0;
        width: 100%;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">COUNTRY PADEL</div>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22" />
        <path d="M8.5 16.5a5 5 0 0 1 7 0" />
        <path d="M5 13a10 10 0 0 1 5.17-2.74" />
        <path d="M19 13a9.97 9.97 0 0 0 -2.5 -4" />
        <path d="M2 8.82a15 15 0 0 1 4.17 -2.65" />
        <path d="M10.66 5.02a15 15 0 0 1 11.34 3.8" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
      <h1>Sin conexión</h1>
      <p>No encontramos internet en este momento. Cuando vuelvas a tener señal, la app se sincroniza sola.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
